name: Build Docker

on:
  workflow_call:

jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version-file: './build-tools/.python-version'

    # - name: Install Python dependencies
    #   run: |
    #     python -m pip install --upgrade pip
    #     pip install ...
    #     # Install any other dependencies your script might need

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Determine version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          # Validate the grammar up front (the version flows into docker build/push
          # command lines inside build.py), so a non-semver tag fails here with a
          # clear message. The leading 'v' is allowed here; build.py strips it.
          if ! echo "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "derived version '$VERSION' is not [v]X.Y.Z[-suffix]; tag a semver release" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        else
          echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        fi

    # Note: the version (and the Docker Hub username) are passed through environment
    # variables instead of direct ${{ }} interpolation into the run block, so that a
    # crafted tag/ref/input cannot inject shell into the step.
    - name: Build and Push Docker images
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        python build-tools/docker/build.py --push --docker-hub-user "$DOCKERHUB_USERNAME" \
          --version "$VERSION" --latest

    env:
      DOCKER_BUILDKIT: 1
