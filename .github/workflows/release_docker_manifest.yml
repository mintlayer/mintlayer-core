name: Assemble multi-arch Docker manifests

# Turns single-arch images that were pushed with "-<arch>" suffixed tags
# (see the "Build Docker" workflow's platform/tag_suffix inputs) into proper
# multi-arch manifest lists under the unsuffixed tags. Nothing is rebuilt:
# the assembly happens entirely on the registry side ("docker buildx imagetools
# create" only references already-pushed manifests).
#
# Assumptions:
# - The "amd64" images exist under the unsuffixed tags (the historical layout)
#   or under explicit "-amd64" tags.
# - The "arm64" images were pushed under "-arm64" tags.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.4.1 (a leading "v" is allowed)'
        required: true
        default: ''

jobs:
  assemble-manifests:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Assemble and push multi-arch manifests
      env:
        INPUT_VERSION: ${{ inputs.version }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        set -euo pipefail

        VERSION="${INPUT_VERSION#v}"
        if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
          echo "invalid version '$INPUT_VERSION'; expected [v]X.Y.Z[-suffix]" >&2
          exit 1
        fi

        # The two base images are only tagged "latest"; the app images carry the
        # release tags plus "latest".
        base_repos=(
          "mintlayer/mintlayer-builder"
          "mintlayer/mintlayer-runner-base"
        )
        app_repos=(
          "$DOCKERHUB_USERNAME/node-daemon"
          "$DOCKERHUB_USERNAME/api-blockchain-scanner-daemon"
          "$DOCKERHUB_USERNAME/api-web-server"
          "$DOCKERHUB_USERNAME/wallet-cli"
          "$DOCKERHUB_USERNAME/wallet-rpc-daemon"
          "$DOCKERHUB_USERNAME/dns-server"
        )

        for repo in "${base_repos[@]}"; do
          tags=(latest)
          for tag in "${tags[@]}"; do
            # Snapshot the existing (historically amd64-only) manifest under an
            # explicit arch tag, unless it's already there (idempotent re-runs).
            if ! docker buildx imagetools inspect "$repo:$tag-amd64" >/dev/null 2>&1; then
              docker buildx imagetools create -t "$repo:$tag-amd64" "$repo:$tag"
            fi
            docker buildx imagetools create -t "$repo:$tag" "$repo:$tag-amd64" "$repo:$tag-arm64"
          done
        done

        for repo in "${app_repos[@]}"; do
          tags=("$VERSION" "v$VERSION" "latest")
          for tag in "${tags[@]}"; do
            if ! docker buildx imagetools inspect "$repo:$tag-amd64" >/dev/null 2>&1; then
              docker buildx imagetools create -t "$repo:$tag-amd64" "$repo:$tag"
            fi
            docker buildx imagetools create -t "$repo:$tag" "$repo:$tag-amd64" "$repo:$tag-arm64"
          done
        done

    - name: Verify manifests
      env:
        INPUT_VERSION: ${{ inputs.version }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        VERSION="${INPUT_VERSION#v}"
        for repo in node-daemon api-blockchain-scanner-daemon api-web-server wallet-cli wallet-rpc-daemon dns-server; do
          echo "=== $DOCKERHUB_USERNAME/$repo:v$VERSION ==="
          docker buildx imagetools inspect "$DOCKERHUB_USERNAME/$repo:v$VERSION" | grep -E '^Name:|Platform:' || true
        done
        echo "=== mintlayer/mintlayer-builder:latest ==="
        docker buildx imagetools inspect "mintlayer/mintlayer-builder:latest" | grep -E '^Name:|Platform:' || true
        echo "=== mintlayer/mintlayer-runner-base:latest ==="
        docker buildx imagetools inspect "mintlayer/mintlayer-runner-base:latest" | grep -E '^Name:|Platform:' || true
