name: Build macOS

on:
  workflow_call:
    inputs:
      binary_list:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        VERSION=${VERSION#v}
        # Validate the grammar up front, so a non-semver tag fails here with a clear
        # message instead of reaching the signing step (the same grammar the Linux and
        # Windows builders enforce).
        if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
          echo "derived version '$VERSION' is not X.Y.Z[-suffix]; tag a semver release" >&2
          exit 1
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version extracted: $VERSION"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: ${{ matrix.arch }}-apple-darwin

    - name: Build
      run: |
        cargo build --release --locked --target ${{ matrix.arch }}-apple-darwin --features trezor,ledger

    # Note: the version (and the workflow input) are passed through environment
    # variables instead of direct ${{ }} interpolation into the run blocks, so
    # that a crafted tag/ref/input cannot inject shell into the steps.
    - name: Sign and Notarize GUI
      env:
        MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        ./build-tools/osx/sign_and_notarize.sh ${{ matrix.arch }} "$VERSION"

    - name: Package Mintlayer Node (without GUI)
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
        BINARY_LIST: ${{ inputs.binary_list }}
      run: |
        mkdir -p "Mintlayer_Node_macos_${VERSION}_${{ matrix.arch }}"
        IFS=',' read -ra BINARIES <<< "$BINARY_LIST"
        for binary in "${BINARIES[@]}"; do
          cp "target/${{ matrix.arch }}-apple-darwin/release/$binary" "Mintlayer_Node_macos_${VERSION}_${{ matrix.arch }}/"
        done
        zip -r "Mintlayer_Node_macos_${VERSION}_${{ matrix.arch }}.zip" "Mintlayer_Node_macos_${VERSION}_${{ matrix.arch }}"

    - name: Upload DMG Artifact (GUI)
      uses: actions/upload-artifact@v4
      with:
        name: Mintlayer_Node_GUI_macos_${{ steps.get_version.outputs.VERSION }}_${{ matrix.arch }}
        path: Mintlayer_Node_GUI_macos_${{ steps.get_version.outputs.VERSION }}_${{ matrix.arch }}.dmg

    - name: Upload Node Artifact (without GUI)
      uses: actions/upload-artifact@v4
      with:
        name: Mintlayer_Node_macos_${{ steps.get_version.outputs.VERSION }}_${{ matrix.arch }}
        path: Mintlayer_Node_macos_${{ steps.get_version.outputs.VERSION }}_${{ matrix.arch }}.zip
