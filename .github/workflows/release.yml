name: Build, Sign and Release

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-macos:
    uses: ./.github/workflows/release_macos.yml
    with:
      binary_list: api-blockchain-scanner-daemon,api-web-server,dns-server,node-daemon,wallet-address-generator,wallet-cli,wallet-rpc-daemon
    secrets: inherit

  build-linux:
    uses: ./.github/workflows/release_linux.yml
    with:
      binary_list: api-blockchain-scanner-daemon,api-web-server,dns-server,node-daemon,wallet-address-generator,wallet-cli,wallet-rpc-daemon
    secrets: inherit

  build-windows:
    uses: ./.github/workflows/release_windows.yml
    with:
      binary_list: api-blockchain-scanner-daemon,api-web-server,dns-server,node-daemon,wallet-address-generator,wallet-cli,wallet-rpc-daemon
    secrets: inherit

  # Docker images still build only after the OS binaries built (a red OS
  # build aborts before any image is pushed). The two per-arch builds run on
  # native runners and serialize behind the release_docker.yml
  # 'docker-release' concurrency group. Within one release run at most one
  # job is ever pending in that group, so the legs of a single run cannot
  # drop each other; across runs the one-pending-slot rule still applies
  # (a newer pending run cancels an older pending one — see the build job
  # in release_docker.yml), so an overlapping release or dispatch can
  # cancel this run's queued arm64 leg, which then skips the assembly and
  # leaves the release amd64-only (create-release does not wait for it);
  # the docker-release-status job below then fails the run so the gap is
  # visible instead of silent.
  # The assembly then merges the two per-arch image
  # sets into multi-arch manifest lists under the unsuffixed tags.
  # create-release deliberately does NOT depend on the arm64 build or the
  # assembly: if either fails, the OS binaries and the amd64 images are
  # still released, and the arm64 half can be repaired afterwards by
  # re-running the failed jobs of this run or by dispatching
  # release_docker.yml (build with tag_suffix arm64, then assembly) from
  # the tag ref.
  build-docker-amd64:
    needs: [build-macos, build-linux, build-windows]
    uses: ./.github/workflows/release_docker.yml
    secrets: inherit

  build-docker-arm64:
    needs: [build-macos, build-linux, build-windows]
    uses: ./.github/workflows/release_docker.yml
    with:
      platform: arm64
      tag_suffix: arm64
      runner: ubuntu-24.04-arm
    secrets: inherit

  assemble-docker:
    needs: [build-docker-amd64, build-docker-arm64]
    uses: ./.github/workflows/release_docker.yml
    with:
      # release.yml only triggers on semver tag pushes, so the ref name is
      # the tag (e.g. 'v1.4.2' or '1.4.2'); release_docker.yml strips a
      # leading 'v' before validating it.
      version: ${{ github.ref_name }}
      assemble_manifests: 'true'
    secrets: inherit

  create-release:
    needs: [build-macos, build-linux, build-windows, build-docker-amd64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v5

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        VERSION=${VERSION#v}
        # Validate the grammar up front, so a non-semver tag fails here with a clear
        # message (the same grammar the Linux, Windows and macOS builders enforce).
        if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
          echo "derived version '$VERSION' is not X.Y.Z[-suffix]; tag a semver release" >&2
          exit 1
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Download Artifacts
      uses: actions/download-artifact@v4

    - name: Generate Hashes
      id: generate_hashes
      run: |
        echo "HASHES<<EOF" >> $GITHUB_OUTPUT
        for file in Mintlayer*/*; do
          if [ -f "$file" ]; then
            echo "$(sha256sum $file | awk '{print $1}')  $(basename $file)" >> $GITHUB_OUTPUT
          fi
        done
        echo "EOF" >> $GITHUB_OUTPUT

    # Note: the version and the hashes are passed through environment variables
    # instead of direct ${{ }} interpolation into the run block, so that a crafted
    # tag/ref/input cannot inject shell into the step.
    - name: Generate Release Body
      id: generate_body
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
        HASHES: ${{ steps.generate_hashes.outputs.HASHES }}
      run: |
        echo "BODY<<EOF" >> $GITHUB_OUTPUT
        echo "Release version $VERSION" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "Please download the appropriate package for your system." >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "Docker Images" >> $GITHUB_OUTPUT
        echo "Find docker images in the docker hub:" >> $GITHUB_OUTPUT
        echo "https://hub.docker.com/u/mintlayer" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "File Hashes (SHA256):" >> $GITHUB_OUTPUT
        echo "\`\`\`" >> $GITHUB_OUTPUT
        echo "$HASHES" >> $GITHUB_OUTPUT
        echo "\`\`\`" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        artifacts: "Mintlayer*/*"
        artifactErrorsFailBuild: true
        name: "Release ${{ steps.get_version.outputs.VERSION }}"
        body: ${{ steps.generate_body.outputs.BODY }}
        token: ${{ secrets.GITHUB_TOKEN }}

  # Runs after everything else and fails the run when a published release
  # lacks its multi-arch assembly (arm64 build failed/canceled — including a
  # concurrency-dropped pending leg, where no job fails and the run would
  # otherwise conclude 'cancelled' — or the assembly itself failed). The
  # status job therefore runs always(); the script only alerts when the
  # release actually shipped, so a deliberately canceled run still
  # terminates quietly and a red run here means "repair the arm64 half",
  # not "the release is missing".
  docker-release-status:
    needs: [create-release, build-docker-amd64, build-docker-arm64, assemble-docker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Check multi-arch completeness
        env:
          RELEASE: ${{ needs.create-release.result }}
          AMD64: ${{ needs.build-docker-amd64.result }}
          ARM64: ${{ needs.build-docker-arm64.result }}
          ASSEMBLY: ${{ needs.assemble-docker.result }}
        run: |
          if [[ "$ASSEMBLY" != 'success' ]]; then
            echo "multi-arch manifest assembly incomplete (release=$RELEASE, amd64=$AMD64, arm64=$ARM64, assembly=$ASSEMBLY)" >&2
            if [[ "$RELEASE" == 'success' ]]; then
              echo "the release shipped amd64-only" >&2
              echo "repair by re-running the failed jobs of this run, or by dispatching release_docker.yml (platform=arm64, tag_suffix=arm64, runner=ubuntu-24.04-arm, then assemble_manifests=true) from the tag ref" >&2
              exit 1
            fi
            echo "the release itself did not ship; fix the earlier failed or skipped job first" >&2
          fi
